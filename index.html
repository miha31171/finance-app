<!doctype html>
<html lang="ru" data-theme="auto"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Финансы">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src https://iss.moex.com https://www.cbr-xml-daily.ru https://api.coingecko.com">
<script>if(/^https?:/.test(location.protocol)){var l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l)}</script><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<title>Мои финансы</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Разделы">
    <div class="brand">💼 <span>Мои финансы</span></div>
    <button data-view="home" aria-label="Главная"><i>🏠</i><span>Главная</span></button>
    <button data-view="ops" aria-label="Операции"><i>📋</i><span>Операции</span></button>
    <button data-view="invest" aria-label="Инвестиции"><i>📈</i><span>Инвестиции</span></button>
    <button data-view="ideas" aria-label="Идеи"><i>💡</i><span>Идеи</span></button>
    <button data-view="more" aria-label="Ещё"><i>☰</i><span>Ещё</span></button>
  </nav>
  <div class="content">
    <header class="topbar"><h1 id="title">Главная</h1><div class="tb-actions"><button class="icon-btn" id="hideBtn" aria-label="Скрыть суммы">👁</button><button class="icon-btn" id="themeBtn" aria-label="Тема оформления">🌓</button></div></header>
    <div id="banner" class="banner hidden" role="note"><span>⚠️ Инвестиционный раздел — образовательная аналитика, не индивидуальная инвестиционная рекомендация. Прогнозы — не гарантии.</span><button class="icon-btn sm" id="bannerX" aria-label="Скрыть предупреждение">✕</button></div>
    <main>
      <section id="v-home" class="view"></section>
      <section id="v-ops" class="view"></section>
      <section id="v-invest" class="view"></section>
      <section id="v-ideas" class="view"></section>
      <section id="v-more" class="view"></section>
    </main>
  </div>
</div>
<button class="fab hidden" id="fab" aria-label="Добавить операцию">＋</button>
<div class="sheet-wrap" id="sheetWrap" aria-hidden="true"><div class="backdrop" id="backdrop"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grab"></div><div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" id="sheetX" aria-label="Закрыть">✕</button></div><div class="sheet-body" id="sheetBody"></div></div></div>
<div id="toasts" aria-live="polite"></div>
<script src="core.js"></script><script src="demo.js"></script><script src="charts.js"></script><script src="app.js"></script><script src="invest.js"></script>
</body></html>
